<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Conecta Rock | Chat online</title>
    <link rel="stylesheet" href="/style.css" />
    <script src="/api/config.js" defer></script>
    <script src="/vendor/socket.io.min.js" defer></script>
    <script src="/script.js" defer></script>
  </head>
  <body>
    <div class="backdrop" aria-hidden="true"></div>

    <main class="app-shell" aria-label="Conecta Rock chat online">
      <aside class="side-panel left-panel">
        <a class="brand" href="/" aria-label="Conecta Rock">
          <span class="pick-logo brand-pick" aria-hidden="true">
            <svg viewBox="0 0 100 110">
              <path class="pick-shape" d="M50 7C27 8 9 25 8 47c-1 26 19 48 42 56 23-8 43-30 42-56C91 25 73 8 50 7Z" />
              <path class="bolt-shape" d="M58 18 34 58h17l-9 35 26-45H51l7-30Z" />
            </svg>
          </span>
          <span class="brand-copy">
            <strong><span>Conecta</span> <b>Rock</b></strong>
          </span>
        </a>

        <section class="profile-tile" aria-label="Perfil atual">
          <span class="pick-logo avatar" id="currentAvatar" aria-hidden="true">
            <svg viewBox="0 0 100 110">
              <path class="pick-shape" d="M50 7C27 8 9 25 8 47c-1 26 19 48 42 56 23-8 43-30 42-56C91 25 73 8 50 7Z" />
              <path class="bolt-shape" d="M58 18 34 58h17l-9 35 26-45H51l7-30Z" />
            </svg>
          </span>
          <span>
            <strong id="currentUsername">PedroDoRock</strong>
            <small id="connectionStatus">desconectado</small>
          </span>
          <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true">
            <path d="m6 9 6 6 6-6" />
          </svg>
        </section>

        <label class="search-box">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="7" />
            <path d="m16.5 16.5 4 4" />
          </svg>
          <input id="roomSearch" type="search" placeholder="Buscar salas ou usuarios" autocomplete="off" />
        </label>

        <nav class="rooms" aria-label="Salas">
          <div class="panel-title">SALAS</div>
          <button class="room-button is-active" type="button" data-room="Geral">
            <span class="room-icon blue">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M5 6.5A3.5 3.5 0 0 1 8.5 3h7A3.5 3.5 0 0 1 19 6.5v4A3.5 3.5 0 0 1 15.5 14H12l-4.5 4v-4A3.5 3.5 0 0 1 4 10.5v-4Z" />
              </svg>
            </span>
            <span>
              <strong>Geral</strong>
              <em>Converse sobre tudo</em>
            </span>
            <small id="roomCount-Geral">0</small>
          </button>
          <button class="room-button" type="button" data-room="Backstage">
            <span class="room-icon dark">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 8h16v11H4V8Z" />
                <path d="M8 8V5h8v3M8 13h8M10 16h4" />
              </svg>
            </span>
            <span>
              <strong>Backstage</strong>
              <em>Bastidores e papo rock</em>
            </span>
            <small id="roomCount-Backstage">0</small>
          </button>
          <button class="room-button" type="button" data-room="Ao vivo">
            <span class="room-icon red">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M8 9a5 5 0 0 0 0 6M16 9a5 5 0 0 1 0 6M5 6a9 9 0 0 0 0 12M19 6a9 9 0 0 1 0 12" />
                <circle cx="12" cy="12" r="2" />
              </svg>
            </span>
            <span>
              <strong>Ao vivo</strong>
              <em>Cobertura e shows</em>
            </span>
            <small id="roomCount-Ao vivo">0</small>
          </button>
        </nav>

        <div class="sidebar-footer">
          <div class="footer-row">
            <span>Tema</span>
            <button class="theme-switch" id="themeToggle" type="button" aria-label="Alternar tema" title="Alternar tema">
              <span class="sun-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <path d="M12 3v2m0 14v2m9-9h-2M5 12H3m15.4-6.4-1.4 1.4M7 17l-1.4 1.4m12.8 0L17 17M7 7 5.6 5.6" />
                  <circle cx="12" cy="12" r="4" />
                </svg>
              </span>
              <span class="moon-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <path d="M20 14.5A7.5 7.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z" />
                </svg>
              </span>
            </button>
          </div>
          <button class="logout-button" id="logoutButton" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M10 17v1a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h3a2 2 0 0 1 2 2v1" />
              <path d="M14 7l5 5-5 5M19 12H8" />
            </svg>
            <span>Sair</span>
          </button>
        </div>
      </aside>

      <section class="chat-panel" aria-label="Conversa">
        <header class="chat-header">
          <div class="room-heading">
            <span class="room-badge">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M5 6.5A3.5 3.5 0 0 1 8.5 3h7A3.5 3.5 0 0 1 19 6.5v4A3.5 3.5 0 0 1 15.5 14H12l-4.5 4v-4A3.5 3.5 0 0 1 4 10.5v-4Z" />
              </svg>
            </span>
            <div>
              <h1 id="roomTitle">Geral</h1>
              <p id="roomSubtitle">Converse sobre tudo</p>
            </div>
          </div>
          <div class="header-actions">
            <span class="room-people" id="roomMeta">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M16 11a4 4 0 1 0-8 0" />
                <path d="M4 19a8 8 0 0 1 16 0" />
                <path d="M18 8a3 3 0 0 1 3 3M3 11a3 3 0 0 1 3-3" />
              </svg>
              <span>0</span>
            </span>
            <button class="icon-button" id="soundToggle" type="button" aria-label="Alternar som" title="Alternar som">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 10v4h4l5 4V6L8 10H4Z" />
                <path d="M16 9.5a4 4 0 0 1 0 5" />
                <path d="M18.5 7a7 7 0 0 1 0 10" />
              </svg>
            </button>
            <button class="icon-button" type="button" aria-label="Mais opcoes" title="Mais opcoes">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 5h.01M12 12h.01M12 19h.01" />
              </svg>
            </button>
          </div>
        </header>

        <ol class="messages" id="messages" aria-live="polite"></ol>
        <div class="typing-line" id="typingLine" aria-live="polite"></div>

        <form class="composer" id="messageForm">
          <div class="composer-tools">
            <button class="icon-button" id="emojiToggle" type="button" aria-label="Abrir emojis" title="Abrir emojis">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="9" />
                <path d="M8 10h.01M16 10h.01M8.5 15a5 5 0 0 0 7 0" />
              </svg>
            </button>
            <label class="icon-button file-button" aria-label="Anexar imagem" title="Anexar imagem">
              <input id="imageInput" type="file" accept="image/png,image/jpeg,image/gif,image/webp" />
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M14 3H7a3 3 0 0 0-3 3v12a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3V9l-6-6Z" />
                <path d="M14 3v6h6M8 15l2-2 2 2 2-3 3 4" />
              </svg>
            </label>
            <select id="targetSelect" aria-label="Destino da mensagem">
              <option value="">Todos da sala</option>
            </select>
          </div>

          <div class="emoji-tray" id="emojiTray" hidden>
            <button type="button">&#127928;</button>
            <button type="button">&#128293;</button>
            <button type="button">&#129304;</button>
            <button type="button">&#9889;</button>
            <button type="button">&#128079;</button>
            <button type="button">&#128516;</button>
          </div>

          <div class="image-preview" id="imagePreview" hidden>
            <img alt="" id="previewImage" />
            <button type="button" id="clearImage">Remover</button>
          </div>

          <div class="input-row">
            <textarea id="messageInput" name="message" rows="1" maxlength="600" placeholder="Mensagem" aria-label="Mensagem"></textarea>
            <button class="send-button" type="submit">
              <span>Enviar</span>
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m4 12 16-8-5 16-3-7-8-1Z" />
              </svg>
            </button>
          </div>
        </form>
      </section>

      <aside class="side-panel right-panel" aria-label="Usuarios online">
        <div class="panel-heading">
          <div>
            <strong>usuarios online</strong>
            <small id="onlineTotal">0 usuarios online</small>
          </div>
          <span class="live-dot" aria-hidden="true"></span>
        </div>
        <label class="search-box user-search">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="7" />
            <path d="m16.5 16.5 4 4" />
          </svg>
          <input id="userSearch" type="search" placeholder="Buscar usuarios" autocomplete="off" />
        </label>
        <button class="all-users is-selected" id="sendToRoom" type="button">Todos da sala</button>
        <ul class="users-list" id="usersList"></ul>
      </aside>
    </main>

    <div class="login-modal" id="loginModal" role="dialog" aria-labelledby="loginTitle" aria-modal="true">
      <form class="login-card" id="loginForm">
        <span class="pick-logo large" aria-hidden="true">
          <svg viewBox="0 0 100 110">
            <path class="pick-shape" d="M50 7C27 8 9 25 8 47c-1 26 19 48 42 56 23-8 43-30 42-56C91 25 73 8 50 7Z" />
            <path class="bolt-shape" d="M58 18 34 58h17l-9 35 26-45H51l7-30Z" />
          </svg>
        </span>
        <h2 id="loginTitle">Conecta Rock</h2>
        <label for="usernameInput">Nome</label>
        <input id="usernameInput" name="username" type="text" maxlength="28" autocomplete="nickname" value="PedroDoRock" required />
        <label for="roomSelect">Sala</label>
        <select id="roomSelect" name="room">
          <option>Geral</option>
          <option>Backstage</option>
          <option>Ao vivo</option>
        </select>
        <button type="submit">Entrar no chat</button>
      </form>
    </div>
  </body>
</html>
